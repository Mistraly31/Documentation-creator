<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>SYSTEM CREATOR</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <nav class="top-nav">
        <button id="theme-toggle">CAMBIAR TEMA</button>
    </nav>

    <div id="hero-header">
        <h1 class="main-title">SYSTEM</h1>
    </div>

    <div id="main-menu" class="menu-container">
        <button class="menu-btn" onclick="openSection('section-tarjeta')">TARJETA</button>
        <button class="menu-btn" onclick="openSection('section-documento')">DOCUMENTO</button>
        <button class="menu-btn" onclick="openSection('section-perfil')">PERFIL</button>
    </div>

    <section id="section-tarjeta" class="app-section hidden">
        <div class="layout">
            <div class="form-side">
                <h2>Datos Tarjeta</h2>
                <input type="file" id="in-t-img" accept="image/*">
                <input type="text" id="in-t-nom" placeholder="Nombre">
                <input type="text" id="in-t-eda" placeholder="Edad">
                <input type="text" id="in-t-sex" placeholder="Sexo">
                <input type="text" id="in-t-raz" placeholder="Raza">
                <input type="text" id="in-t-id" placeholder="Número ID">
                <input type="text" id="in-t-res" placeholder="Residencia">
                <div class="btns">
                    <button class="create-btn" onclick="takeSnapshot('view-tarjeta')">CREAR IMAGEN</button>
                    <button class="back-btn" onclick="goHome()">VOLVER</button>
                </div>
            </div>
            <div id="view-tarjeta" class="dni-box">
                <div class="dni-photo" id="out-t-img"></div>
                <div class="dni-text">
                    <p><b>NOMBRE:</b> <span id="out-t-nom"></span></p>
                    <p><b>EDAD:</b> <span id="out-t-eda"></span></p>
                    <p><b>SEXO:</b> <span id="out-t-sex"></span></p>
                    <p><b>RAZA:</b> <span id="out-t-raz"></span></p>
                    <p><b>ID:</b> <span id="out-t-id"></span></p>
                    <p><b>RES:</b> <span id="out-t-res"></span></p>
                </div>
            </div>
        </div>
    </section>

    <section id="section-documento" class="app-section hidden">
        <div class="layout">
            <div class="form-side">
                <h2>Datos Documento</h2>
                <input type="text" id="in-d-tit" placeholder="Título">
                <input type="text" id="in-d-fec" placeholder="Fecha">
                <input type="text" id="in-d-ubi" placeholder="Ubicación">
                <input type="text" id="in-d-aut" placeholder="Autor">
                <textarea id="in-d-tex" placeholder="Escribe el texto..."></textarea>
                <div class="btns">
                    <button class="create-btn" onclick="takeSnapshot('view-documento')">CREAR IMAGEN</button>
                    <button class="back-btn" onclick="goHome()">VOLVER</button>
                </div>
            </div>
            <div id="view-documento" class="paper-box">
                <h1 id="out-d-tit">TÍTULO</h1>
                <p class="meta"><span id="out-d-fec"></span> | <span id="out-d-ubi"></span> | <span id="out-d-aut"></span></p>
                <hr>
                <div id="out-d-tex" class="paper-content"></div>
            </div>
        </div>
    </section>

    <section id="section-perfil" class="app-section hidden">
        <div class="layout">
            <div class="form-side">
                <h2>Datos Perfil</h2>
                <input type="file" id="in-p-img" accept="image/*">
                <input type="text" id="in-p-nom" placeholder="Nombre">
                <input type="text" id="in-p-eda" placeholder="Edad">
                <input type="text" id="in-p-sex" placeholder="Sexo">
                <input type="text" id="in-p-raz" placeholder="Raza">
                <input type="text" id="in-p-id" placeholder="ID">
                <input type="text" id="in-p-res" placeholder="Residencia">
                <input type="text" id="in-p-tra" placeholder="Trabajo">
                <input type="text" id="in-p-car" placeholder="Cargos">
                <textarea id="in-p-inf" placeholder="Información Adicional"></textarea>
                <div class="btns">
                    <button class="create-btn" onclick="takeSnapshot('view-perfil')">CREAR IMAGEN</button>
                    <button class="back-btn" onclick="goHome()">VOLVER</button>
                </div>
            </div>
            <div id="view-perfil" class="pc-box">
                <div class="pc-bar">SYSTEM_USER_INTERFACE_OS</div>
                <div class="pc-main">
                    <div class="pc-left">
                        <div class="pc-photo" id="out-p-img"></div>
                        <h3 id="out-p-nom">USER</h3>
                        <p id="out-p-tra" style="color:#0f0"></p>
                    </div>
                    <div class="pc-right">
                        <div class="grid">
                            <p><b>EDAD:</b> <span id="out-p-eda"></span></p>
                            <p><b>SEXO:</b> <span id="out-p-sex"></span></p>
                            <p><b>RAZA:</b> <span id="out-p-raz"></span></p>
                            <p><b>ID:</b> <span id="out-p-id"></span></p>
                        </div>
                        <p><b>RESIDENCIA:</b> <span id="out-p-res"></span></p>
                        <p><b>CARGOS:</b> <span id="out-p-car"></span></p>
                        <div class="extra-box">
                            <b>ADICIONAL:</b>
                            <p id="out-p-inf"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
