<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM - Image Generator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <header>
        <button id="theme-toggle">Cambiar Tema</button>
        <h1 class="logo">SYSTEM</h1>
    </header>

    <main id="home-menu">
        <button onclick="showSection('tarjeta')">Tarjeta</button>
        <button onclick="showSection('documento')">Documento</button>
        <button onclick="showSection('perfil')">Perfil</button>
    </main>

    <section id="form-container" style="display: none;">
        <button onclick="goBack()">⬅ Volver</button>
        <div id="fields"></div>
        <button id="create-btn" class="primary-btn">Crear Imagen</button>
    </section>

    <div id="capture-area" class="preview-card"></div>

    <script src="script.js"></script>
    <script src="generator.js"></script>
</body>
</html>
